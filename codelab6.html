
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Tricks Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Magic Tricks Showcase</h1>
    </header>

    <main>
        <section>
            <h2>Button Alchemy</h2>
            <p id="magicText"></p>
            <button id="trick1">Magic Trick 1</button>
        </section>

        <section>
            <h2>Spellbound Hues</h2>
            <p id="colorText">
                Witness the mysterious transformation of text right before your eyes!
            </p>
            <button id="trick2">Magic Trick 2</button>
        </section>

        <section>
            <h2>Hat of Wonders</h2>
            <p id="imageText">
                See what magical surprises the magician can pull out of a seemingly ordinary hat!
            </p>
            <button id="trick3">Magic Trick 3</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
