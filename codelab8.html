
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Lab 8 - Username Checker</title>
  <link rel="stylesheet" href="codelab8.css">
  <script src="codelab8.js" defer></script>
</head>

<body>
  <main class="container">
    <div class="signup-box">

      <div class="left-section">
        <h1 class="logo">G</h1>
        <h1>How you'll sign in</h1>
        <p>Create a Gmail address for signing in to your Google Account</p>
      </div>

      <div class="right-section">
        <form id="signup-form">

          <label for="username">Username</label>

          <div id="input-box">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              autocomplete="off"
            >
            <span>@gmail.com</span>
          </div>

          <p id="warning" class="hidden"></p>

          <div id="suggestions" class="hidden"></div>

          <div id="next-steps" class="hidden">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
            >

            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm password"
            >

            <button type="submit" id="next-button">
              Next
            </button>
          </div>

          <p id="message"></p>

        </form>
      </div>

    </div>
  </main>
</body>
</html>
